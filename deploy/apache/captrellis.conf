# CAP Trellis — Apache virtual host (reverse proxy to the Next.js server)
# Enable modules first:
#   sudo a2enmod proxy proxy_http headers ssl rewrite
# Install:
#   sudo cp deploy/apache/captrellis.conf /etc/apache2/sites-available/
#   (edit ServerName + certificate paths) then:
#   sudo a2ensite captrellis && sudo systemctl reload apache2
#
# TLS: this vhost assumes Apache terminates HTTPS (certbot --apache is the
# quickest way to provision the certificate). If staff will reach the app
# over plain HTTP on a trusted internal network instead, skip the :443 block
# and set CSBG_ALLOW_HTTP=1 in the app's .env.local — otherwise the session
# cookie is marked Secure and sign-in will not stick over http://.

<VirtualHost *:80>
    ServerName captrellis.example.org
    # everything to HTTPS
    RewriteEngine On
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName captrellis.example.org

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/captrellis.example.org/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/captrellis.example.org/privkey.pem

    # proxy to the Next.js server (systemd unit, 127.0.0.1:3100)
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3100/ retry=1
    ProxyPassReverse / http://127.0.0.1:3100/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # spreadsheet imports and document uploads run through server actions —
    # keep Apache's request-body ceiling above the app's 4 MB action limit
    LimitRequestBody 16777216

    ErrorLog  ${APACHE_LOG_DIR}/captrellis-error.log
    CustomLog ${APACHE_LOG_DIR}/captrellis-access.log combined
</VirtualHost>
